name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python tools/check_release.py
      - run: python -m compileall -q native_runner
      - run: python -m pytest native_runner/tests/test_offline_build.py native_runner/tests/test_offline_install.py native_runner/tests/test_contracts.py -q
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_install.py
      # The whole suite runs on CPU in about 1.5 minutes. CUDA, PowerShell and
      # original-APK checks skip themselves when their prerequisites are absent.
      - run: python -m pytest native_runner/tests -q
      - run: python -m pip install ruff==0.14.0
      - run: python -m ruff check native_runner/training/v4/eval_stats.py native_runner/training/v4/tournament.py native_runner/training/v4/evaluate.py
